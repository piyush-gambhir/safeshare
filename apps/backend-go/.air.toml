



root = "."
tmp_dir = "tmp"

[build]

cmd = "go build -o ./tmp/main ./cmd/api"

bin = "tmp/main"

full_bin = "./tmp/main"

include_ext = ["go", "tpl", "tmpl", "html", "sql"]

exclude_dir = ["assets", "tmp", "vendor", "docs", ".git", "node_modules"]

include_dir = []

exclude_file = []

exclude_regex = ["_test\\.go"]

exclude_unchanged = true

follow_symlink = true

log = "air.log"

delay = 1000

stop_on_error = true

send_interrupt = false

kill_delay = 500

[log]

time = false

[color]

main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]

clean_on_exit = true
