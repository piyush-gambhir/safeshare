name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    strategy:
      matrix:
        node: ['24.22.1', '26.12.1']
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: "**/pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # next build stopped running ESLint in Next 16, so lint runs as its own step.
      - name: Lint Web App
        run: pnpm --filter ./apps/web lint

      - name: Lint Backend (Fastify)
        run: pnpm --filter ./apps/backend-fastify lint

      - name: Lint Electron App
        run: pnpm --filter ./apps/electron lint

      - name: Typecheck applications
        run: pnpm -r typecheck

      - name: Compiler API compatibility
        run: pnpm -r typecheck:compat

      - name: Test Electron transfer contracts
        run: pnpm --filter ./apps/electron test

      - name: Build Web App
        run: pnpm run build:web

      - name: Bundle Electron App
        run: pnpm --filter ./apps/electron exec vite build

      - name: Build Backend (Fastify)
        run: pnpm run build:backend-fastify
